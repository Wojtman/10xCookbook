name: Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        env:
          CI: true
        run: npm run lint

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        env:
          CI: true
        run: npm run test -- --run --coverage

      - name: Upload unit test coverage
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: coverage
          if-no-files-found: warn

  e2e-tests:
    name: E2E Tests
    needs: lint
    runs-on: ubuntu-latest
    environment: integration
    env:
      PUBLIC_SUPABASE_DB_URL: ${{ secrets.PUBLIC_SUPABASE_DB_URL }}
      PUBLIC_SUPABASE_DB_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_DB_ANON_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      E2E_USERNAME_ID: ${{ secrets.E2E_USERNAME_ID }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with coverage
        run: npm run test:e2e -- --coverage

      - name: Upload e2e coverage
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage
          path: playwright-report/coverage
          if-no-files-found: warn

  status-comment:
    name: Status Comment
    needs:
      - lint
      - unit-tests
      - e2e-tests
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on pull request
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- pr-status -->";
            const prNumber = context.payload.pull_request?.number;

            if (!prNumber) {
              core.info("No pull request number found; skipping comment.");
              return;
            }

            const body = `${marker}\n✅ Lint, unit tests, and e2e tests all passed for ${context.sha}.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
